<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>돼지쌤네 학교 덧셈과 뺄셈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fef3c7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f2937;
    }

    .app {
      width: 92%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
      color: #2563eb;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .score-box {
      background: #eff6ff;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .score-label {
      font-size: 14px;
      color: #64748b;
    }

    #score {
      font-size: 36px;
      font-weight: bold;
      color: #2563eb;
      margin-top: 5px;
    }

    .level-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-bottom: 25px;
    }

    .level-btn {
      border: none;
      padding: 11px 5px;
      border-radius: 10px;
      background: #e5e7eb;
      color: #374151;
      cursor: pointer;
      font-weight: bold;
    }

    .level-btn:hover {
      background: #dbeafe;
    }

    .level-btn.active {
      background: #2563eb;
      color: white;
    }

    .question-box {
      background: #f8fafc;
      border-radius: 18px;
      padding: 30px 15px;
      margin-bottom: 20px;
    }

    #question {
      font-size: 44px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #111827;
    }

    #answer {
      width: 80%;
      max-width: 280px;
      padding: 15px;
      font-size: 28px;
      text-align: center;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
    }

    #answer:focus {
      border-color: #2563eb;
    }

    .check-btn {
      width: 80%;
      max-width: 280px;
      margin-top: 15px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .check-btn:hover {
      background: #1d4ed8;
    }

    .reset-btn {
      width: 80%;
      max-width: 280px;
      margin-top: 10px;
      padding: 12px;
      font-size: 17px;
      font-weight: bold;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      background: white;
      color: #475569;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #f8fafc;
    }

    #result {
      min-height: 30px;
      margin-top: 18px;
      font-size: 19px;
      font-weight: bold;
    }

    .correct {
      color: #16a34a;
    }

    .wrong {
      color: #dc2626;
    }

    .level-info {
      margin-top: 20px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 12px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 450px) {
      .app {
        padding: 25px 15px;
      }

      h1 {
        font-size: 26px;
      }

      #question {
        font-size: 36px;
      }

      .levels {
        grid-template-columns: repeat(5, 1fr);
      }

      .level-btn {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🐷 돼지쌤네 학교 덧셈과 뺄셈</h1>
    <div class="subtitle">문제를 풀고 점수를 올려보세요!</div>

    <div class="score-box">
      <div class="score-label">현재 점수</div>
      <div id="score">0점</div>
    </div>

    <div class="level-title">난이도를 선택하세요</div>

    <div class="levels">
      <button class="level-btn active" onclick="changeLevel(1)">1단계</button>
      <button class="level-btn" onclick="changeLevel(2)">2단계</button>
      <button class="level-btn" onclick="changeLevel(3)">3단계</button>
      <button class="level-btn" onclick="changeLevel(4)">4단계</button>
      <button class="level-btn" onclick="changeLevel(5)">5단계</button>
    </div>

    <div class="question-box">
      <div id="question">문제를 준비하고 있습니다...</div>
    </div>

    <input
      type="number"
      id="answer"
      placeholder="정답 입력"
      autocomplete="off"
    >

    <br>

    <button class="check-btn" onclick="checkAnswer()">
      정답 확인
    </button>

    <button class="reset-btn" onclick="resetScore()">
      점수 초기화
    </button>

    <div id="result"></div>

    <div class="level-info" id="levelInfo">
      1단계: 받아올림이 없는 한자리수 덧셈과 뺄셈
    </div>

  </div>


<script>

  // -----------------------------
  // 게임 기본 설정
  // -----------------------------

  let score = 0;
  let currentLevel = 1;

  let number1 = 0;
  let number2 = 0;
  let operator = "+";
  let correctAnswer = 0;

  let answered = false;


  // -----------------------------
  // 점수 표시
  // -----------------------------

  function updateScore() {
    document.getElementById("score").textContent = score + "점";
  }


  // -----------------------------
  // 난수 생성
  // -----------------------------

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }


  // -----------------------------
  // 난이도 변경
  // -----------------------------

  function changeLevel(level) {

    currentLevel = level;

    document.querySelectorAll(".level-btn").forEach((button, index) => {
      if (index + 1 === level) {
        button.classList.add("active");
      } else {
        button.classList.remove("active");
      }
    });

    const descriptions = {
      1: "1단계: 받아올림이 없는 한자리수 덧셈과 뺄셈",
      2: "2단계: 받아올림이 있는 한자리수 덧셈과 두자리수-한자리수 뺄셈",
      3: "3단계: 받아올림이 있는 두자리수 덧셈과 받아내림이 있는 두자리수 뺄셈",
      4: "4단계: 백의자리 덧셈과 뺄셈",
      5: "5단계: 천의자리 덧셈과 뺄셈"
    };

    document.getElementById("levelInfo").textContent =
      descriptions[level];

    generateQuestion();
  }


  // -----------------------------
  // 문제 생성
  // -----------------------------

  function generateQuestion() {

    answered = false;

    document.getElementById("answer").value = "";
    document.getElementById("result").textContent = "";
    document.getElementById("result").className = "";

    switch (currentLevel) {

      // =============================
      // 1단계
      // 받아올림 없는 한자리수 + 한자리수
      // 한자리수 - 한자리수
      // =============================

      case 1:

        operator = Math.random() < 0.5 ? "+" : "-";

        if (operator === "+") {

          do {
            number1 = randomInt(1, 9);
            number2 = randomInt(1, 9);
          } while (number1 + number2 >= 10);

        } else {

          number1 = randomInt(1, 9);
          number2 = randomInt(1, number1);

        }

        break;


      // =============================
      // 2단계
      // 받아올림 있는 한자리수 + 한자리수
      // 두자리수 - 한자리수
      // =============================

      case 2:

        operator = Math.random() < 0.5 ? "+" : "-";

        if (operator === "+") {

          do {
            number1 = randomInt(1, 9);
            number2 = randomInt(1, 9);
          } while (number1 + number2 < 10);

        } else {

          number1 = randomInt(10, 99);
          number2 = randomInt(1, 9);

          if (number1 < number2) {
            [number1, number2] = [number2, number1];
          }

        }

        break;


      // =============================
      // 3단계
      // 받아올림 있는 두자리수 + 두자리수
      // 받아내림 있는 두자리수 - 두자리수
      // =============================

      case 3:

        operator = Math.random() < 0.5 ? "+" : "-";

        if (operator === "+") {

          do {
            number1 = randomInt(10, 99);
            number2 = randomInt(10, 99);
          } while (
            (number1 % 10) + (number2 % 10) < 10
          );

        } else {

          do {
            number1 = randomInt(10, 99);
            number2 = randomInt(10, 99);

            if (number1 < number2) {
              [number1, number2] = [number2, number1];
            }

          } while (
            (number1 % 10) >= (number2 % 10)
          );

        }

        break;


      // =============================
      // 4단계
      // 백의자리 덧셈과 뺄셈
      // =============================

      case 4:

        operator = Math.random() < 0.5 ? "+" : "-";

        number1 = randomInt(100, 999);
        number2 = randomInt(100, 999);

        if (operator === "-" && number1 < number2) {
          [number1, number2] = [number2, number1];
        }

        break;


      // =============================
      // 5단계
      // 천의자리 덧셈과 뺄셈
      // =============================

      case 5:

        operator = Math.random() < 0.5 ? "+" : "-";

        number1 = randomInt(1000, 9999);
        number2 = randomInt(1000, 9999);

        if (operator === "-" && number1 < number2) {
          [number1, number2] = [number2, number1];
        }

        break;
    }


    correctAnswer =
      operator === "+"
        ? number1 + number2
        : number1 - number2;


    document.getElementById("question").textContent =
      `${number1} ${operator} ${number2} = ?`;

    document.getElementById("answer").focus();
  }


  // -----------------------------
  // 정답 확인
  // -----------------------------

  function checkAnswer() {

    // 이미 답을 제출한 문제는 다시 채점하지 않음
    if (answered) {
      return;
    }

    const input = document.getElementById("answer").value.trim();

    if (input === "") {
      document.getElementById("result").textContent =
        "정답을 입력해주세요.";
      document.getElementById("result").className = "wrong";
      return;
    }

    const userAnswer = Number(input);

    answered = true;

    // 단계별 점수
    // 1단계: 정답 +10점 / 오답 -5점
    // 2단계: 정답 +20점 / 오답 -15점
    // 3단계: 정답 +30점 / 오답 -25점
    // 4단계: 정답 +40점 / 오답 -35점
    // 5단계: 정답 +50점 / 오답 -45점
    const correctPoints = currentLevel * 10;
    const wrongPoints = currentLevel * 10 - 5;

    if (userAnswer === correctAnswer) {

      score += correctPoints;
      updateScore();

      document.getElementById("result").textContent =
        `🎉 정답입니다! +${correctPoints}점`;

      document.getElementById("result").className = "correct";

    } else {

      score -= wrongPoints;
      updateScore();

      document.getElementById("result").textContent =
        `아쉬워요! 정답은 ${correctAnswer}입니다. -${wrongPoints}점`;

      document.getElementById("result").className = "wrong";
    }

    // 잠시 결과를 보여준 후 다음 문제
    setTimeout(() => {
      generateQuestion();
    }, 1200);
  }


  // -----------------------------
  // 점수 초기화
  // -----------------------------

  function resetScore() {
    if (confirm("현재 점수를 0점으로 초기화할까요?")) {
      score = 0;
      updateScore();

      document.getElementById("result").textContent =
        "점수가 0점으로 초기화되었습니다.";

      document.getElementById("result").className = "";
    }
  }


  // -----------------------------
  // 엔터키로 정답 제출
  // -----------------------------

  document.getElementById("answer").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      checkAnswer();
    }

  });


  // -----------------------------
  // 게임 시작
  // -----------------------------

  updateScore();
  generateQuestion();

</script>

</body>
</html>
