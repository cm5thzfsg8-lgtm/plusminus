<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돼지쌤네 학교 덧셈과 뺄셈</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: linear-gradient(135deg, #dbeafe, #fef3c7);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #1f2937;
}

.app {
  width: 92%;
  max-width: 520px;
  background: white;
  border-radius: 24px;
  padding: 30px 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  text-align: center;
}

h1 {
  margin-top: 0;
  font-size: 30px;
  color: #2563eb;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

.score-box {
  background: #eff6ff;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 20px;
}

.score-label {
  font-size: 14px;
  color: #64748b;
}

#score {
  font-size: 36px;
  font-weight: bold;
  color: #2563eb;
  margin-top: 5px;
}

.level-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.levels {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-bottom: 20px;
}

.level-btn {
  border: none;
  padding: 11px 5px;
  border-radius: 10px;
  background: #e5e7eb;
  color: #374151;
  cursor: pointer;
  font-weight: bold;
}

.level-btn.active {
  background: #2563eb;
  color: white;
}

.timer-box {
  display: flex;
  justify-content: center;
  margin: 0 auto 15px;
}

.timer {
  position: relative;
  width: 110px;
  height: 110px;
}

.timer svg {
  width: 110px;
  height: 110px;
  transform: rotate(-90deg);
}

.timer-track,
.timer-progress {
  fill: none;
  stroke-width: 9;
}

.timer-track { stroke: #e5e7eb; }

.timer-progress {
  stroke: #2563eb;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.08s linear;
}

.timer.warning .timer-progress {
  stroke: #f59e0b;
}

.timer.danger .timer-progress {
  stroke: #dc2626;
}

.timer-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#timerSeconds {
  font-size: 25px;
  font-weight: bold;
}

.timer-label {
  font-size: 11px;
  color: #64748b;
}

/* 시작 및 정지 버튼 */

.control-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

.control-btn {
  width: 42%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start-btn { background: #16a34a; }
.stop-btn { background: #ef4444; }

.control-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.question-box {
  background: #f8fafc;
  border-radius: 18px;
  padding: 30px 15px;
  margin-bottom: 20px;
}

#question {
  font-size: 44px;
  font-weight: bold;
  letter-spacing: 3px;
}

#answer {
  width: 80%;
  max-width: 280px;
  padding: 15px;
  font-size: 28px;
  text-align: center;
  border: 3px solid #cbd5e1;
  border-radius: 14px;
  outline: none;
}

#answer:focus {
  border-color: #2563eb;
}

.check-btn {
  width: 80%;
  max-width: 280px;
  margin-top: 15px;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 14px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.reset-btn {
  width: 80%;
  max-width: 280px;
  margin-top: 10px;
  padding: 12px;
  font-size: 17px;
  font-weight: bold;
  border: 2px solid #cbd5e1;
  border-radius: 14px;
  background: white;
  color: #475569;
  cursor: pointer;
}

#result {
  min-height: 30px;
  margin-top: 18px;
  font-size: 19px;
  font-weight: bold;
}

.correct { color: #16a34a; }
.wrong { color: #dc2626; }

.level-info {
  margin-top: 20px;
  padding: 12px;
  background: #f9fafb;
  border-radius: 12px;
  color: #64748b;
  font-size: 14px;
  line-height: 1.6;
}

@media (max-width: 450px) {
  .app { padding: 25px 15px; }
  h1 { font-size: 26px; }
  #question { font-size: 36px; }
  .level-btn { font-size: 13px; }
}
</style>
</head>

<body>

<div class="app">

  <h1>🐷 돼지쌤네 학교 덧셈과 뺄셈</h1>
  <div class="subtitle">
    문제를 풀고 점수를 올려보세요!
  </div>

  <div class="score-box">
    <div class="score-label">현재 점수</div>
    <div id="score">0점</div>
  </div>

  <div class="level-title">난이도를 선택하세요</div>

  <div class="levels">
    <button class="level-btn active" onclick="changeLevel(1)">1단계</button>
    <button class="level-btn" onclick="changeLevel(2)">2단계</button>
    <button class="level-btn" onclick="changeLevel(3)">3단계</button>
    <button class="level-btn" onclick="changeLevel(4)">4단계</button>
    <button class="level-btn" onclick="changeLevel(5)">5단계</button>
  </div>

  <div class="timer-box">
    <div class="timer" id="timer">
      <svg viewBox="0 0 110 110">
        <circle class="timer-track"
          cx="55" cy="55" r="46"></circle>
        <circle class="timer-progress"
          id="timerProgress"
          cx="55" cy="55" r="46"></circle>
      </svg>
      <div class="timer-text">
        <div id="timerSeconds">10.0</div>
        <div class="timer-label">초</div>
      </div>
    </div>
  </div>

  <div class="control-buttons">
    <button id="startBtn"
      class="control-btn start-btn"
      onclick="startGame()">▶ 시작</button>

    <button id="stopBtn"
      class="control-btn stop-btn"
      onclick="pauseGame()" disabled>⏸ 정지</button>
  </div>

  <div class="question-box">
    <div id="question">시작 버튼을 눌러주세요!</div>
  </div>

  <input type="number" id="answer"
    placeholder="정답 입력"
    autocomplete="off" disabled>

  <br>

  <button class="check-btn"
    id="checkBtn"
    onclick="checkAnswer()" disabled>
    정답 확인
  </button>

  <button class="reset-btn" onclick="resetScore()">
    점수 초기화
  </button>

  <div id="result"></div>

  <div class="level-info" id="levelInfo">
    1단계: 받아올림이 없는 한자리수 덧셈과 뺄셈
  </div>

</div>

<script>

// 기본 설정
let score = 0;
let currentLevel = 1;

let number1 = 0;
let number2 = 0;
let operator = "+";
let correctAnswer = 0;

let answered = false;
let gameStarted = false;
let paused = false;

const TIME_LIMIT = 20;

let remainingTime = TIME_LIMIT;
let timerId = null;
let timerStartTime = 0;
let timerRunning = false;
let nextQuestionTimeout = null;

const timerCircumference = 2 * Math.PI * 46;

function updateScore() {
  document.getElementById("score").textContent =
    score + "점";
}

function randomInt(min, max) {
  return Math.floor(Math.random() *
    (max - min + 1)) + min;
}

// 버튼 상태
function updateButtons() {
  const playing = gameStarted && !paused;

  document.getElementById("startBtn").disabled =
    playing;

  document.getElementById("stopBtn").disabled =
    !playing;

  document.getElementById("answer").disabled =
    !playing || answered;

  document.getElementById("checkBtn").disabled =
    !playing || answered;
}

// 타이머 표시
function updateTimerVisual() {
  const timer = document.getElementById("timer");
  const progress =
    document.getElementById("timerProgress");

  document.getElementById("timerSeconds").textContent =
    remainingTime.toFixed(1);

  progress.style.strokeDasharray =
    timerCircumference;

  progress.style.strokeDashoffset =
    timerCircumference *
    (1 - remainingTime / TIME_LIMIT);

  timer.classList.toggle("warning",
    remainingTime <= 3 && remainingTime > 1);

  timer.classList.toggle("danger",
    remainingTime <= 1);
}

function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
  timerRunning = false;
}

function startTimer() {
  stopTimer();

  timerStartTime = performance.now();
  const initialRemaining = remainingTime;

  timerRunning = true;

  timerId = setInterval(() => {
    if (!timerRunning || paused || answered) return;

    const elapsed =
      (performance.now() - timerStartTime) / 1000;

    remainingTime =
      Math.max(0, initialRemaining - elapsed);

    updateTimerVisual();

    if (remainingTime <= 0) {
      stopTimer();
      timeUp();
    }
  }, 50);
}

// 시작
function startGame() {
  if (gameStarted && !paused) return;

  if (!gameStarted) {
    gameStarted = true;
    paused = false;
    generateQuestion();
  } else {
    paused = false;
    startTimer();
  }

  updateButtons();

  if (!answered) {
    document.getElementById("answer").focus();
  }
}

// 정지
function pauseGame() {
  if (!gameStarted || paused) return;

  paused = true;
  stopTimer();

  document.getElementById("result").textContent =
    "⏸ 일시정지 중입니다.";

  document.getElementById("result").className = "";

  updateButtons();
}

// 시간 초과
function timeUp() {
  if (answered) return;

  answered = true;

  const wrongPoints = currentLevel * 10 - 5;

  score -= wrongPoints;
  updateScore();

  document.getElementById("result").textContent =
    `⏰ 시간 초과! 정답은 ${correctAnswer}입니다. -${wrongPoints}점`;

  document.getElementById("result").className =
    "wrong";

  updateButtons();

  nextQuestionTimeout = setTimeout(() => {
    nextQuestionTimeout = null;
    if (gameStarted && !paused) generateQuestion();
  }, 1400);
}

// 난이도 변경
function changeLevel(level) {
  currentLevel = level;

  document.querySelectorAll(".level-btn")
    .forEach((button, index) => {
      button.classList.toggle("active",
        index + 1 === level);
    });

  const descriptions = {
    1: "1단계: 받아올림이 없는 한자리수 덧셈과 뺄셈",
    2: "2단계: 받아올림이 있는 한자리수 덧셈과 두자리수-한자리수 뺄셈",
    3: "3단계: 받아올림이 있는 두자리수 덧셈과 받아내림이 있는 두자리수 뺄셈",
    4: "4단계: 백의자리 덧셈과 뺄셈",
    5: "5단계: 천의자리 덧셈과 뺄셈"
  };

  document.getElementById("levelInfo").textContent =
    descriptions[level];

  stopTimer();
  clearTimeout(nextQuestionTimeout);
  nextQuestionTimeout = null;

  gameStarted = false;
  paused = false;
  answered = false;
  remainingTime = TIME_LIMIT;

  updateTimerVisual();

  document.getElementById("question").textContent =
    "시작 버튼을 눌러주세요!";

  document.getElementById("result").textContent = "";
  document.getElementById("answer").value = "";

  updateButtons();
}

// 문제 생성
function generateQuestion() {
  stopTimer();

  answered = false;

  document.getElementById("answer").value = "";
  document.getElementById("result").textContent = "";
  document.getElementById("result").className = "";

  switch (currentLevel) {

    case 1:
      operator = Math.random() < 0.5 ? "+" : "-";

      if (operator === "+") {
        do {
          number1 = randomInt(1, 9);
          number2 = randomInt(1, 9);
        } while (number1 + number2 >= 10);
      } else {
        number1 = randomInt(1, 9);
        number2 = randomInt(1, number1);
      }
      break;

    case 2:
      operator = Math.random() < 0.5 ? "+" : "-";

      if (operator === "+") {
        do {
          number1 = randomInt(1, 9);
          number2 = randomInt(1, 9);
        } while (number1 + number2 < 10);
      } else {
        number1 = randomInt(10, 19);
        number2 = randomInt(1, 9);
      }
      break;

    case 3:
      operator = Math.random() < 0.5 ? "+" : "-";

      if (operator === "+") {
        do {
          number1 = randomInt(10, 99);
          number2 = randomInt(10, 99);
        } while (
          (number1 % 10) + (number2 % 10) < 10
        );
      } else {
        do {
          number1 = randomInt(10, 99);
          number2 = randomInt(10, 99);

          if (number1 < number2) {
            [number1, number2] =
              [number2, number1];
          }
        } while (
          (number1 % 10) >= (number2 % 10)
        );
      }
      break;

    case 4:
      operator = Math.random() < 0.5 ? "+" : "-";

      number1 = randomInt(100, 999);
      number2 = randomInt(100, 999);

      if (operator === "-" && number1 < number2) {
        [number1, number2] = [number2, number1];
      }
      break;

    case 5:
      operator = Math.random() < 0.5 ? "+" : "-";

      number1 = randomInt(1000, 9999);
      number2 = randomInt(1000, 9999);

      if (operator === "-" && number1 < number2) {
        [number1, number2] = [number2, number1];
      }
      break;
  }

  correctAnswer =
    operator === "+"
      ? number1 + number2
      : number1 - number2;

  document.getElementById("question").textContent =
    `${number1} ${operator} ${number2} = ?`;

  remainingTime = TIME_LIMIT;
  updateTimerVisual();
  updateButtons();
  startTimer();

  document.getElementById("answer").focus();
}

// 정답 확인
function checkAnswer() {
  if (answered || paused || !gameStarted) return;

  const input =
    document.getElementById("answer").value.trim();

  if (input === "") {
    document.getElementById("result").textContent =
      "정답을 입력해주세요.";
    document.getElementById("result").className =
      "wrong";
    return;
  }

  const userAnswer = Number(input);

  answered = true;
  stopTimer();

  const correctPoints = currentLevel * 10;
  const wrongPoints = currentLevel * 10 - 5;

  if (userAnswer === correctAnswer) {
    score += correctPoints;

    document.getElementById("result").textContent =
      `🎉 정답입니다! +${correctPoints}점`;

    document.getElementById("result").className =
      "correct";
  } else {
    score -= wrongPoints;

    document.getElementById("result").textContent =
      `아쉬워요! 정답은 ${correctAnswer}입니다. -${wrongPoints}점`;

    document.getElementById("result").className =
      "wrong";
  }

  updateScore();
  updateButtons();

  nextQuestionTimeout = setTimeout(() => {
    nextQuestionTimeout = null;
    if (gameStarted && !paused) generateQuestion();
  }, 1200);
}

// 점수 초기화
function resetScore() {
  if (confirm("현재 점수를 0점으로 초기화할까요?")) {
    score = 0;
    updateScore();

    document.getElementById("result").textContent =
      "점수가 0점으로 초기화되었습니다.";
    document.getElementById("result").className = "";
  }
}

// 엔터키
document.getElementById("answer")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      checkAnswer();
    }
  });

// 최초 실행: 시작 버튼을 누를 때까지 대기
updateScore();
updateTimerVisual();
updateButtons();

</script>
</body>
</html>
